<div class="vision-data data-board">
  <aside class="data-sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">Insightly</div>
      <p class="sidebar-label">CRM</p>
    </div>
    <ul class="sidebar-nav">
      <li
        *ngFor="let link of sidebarLinks"
        (click)="selectSidebar(link)"
        [class.active]="activeLink === link">
        <span class="icon">{{ link.icon }}</span>
        <span>{{ link.label }}</span>
      </li>
    </ul>
    <div class="sidebar-footer">
      <button class="sidebar-cta">Actions</button>
    </div>
  </aside>

  <section class="data-main">
    <header class="board-header">
      <div>
        <h1>Business Insights Dashboard</h1>
        <p>The CRM Data Journey and its KPI tiles.</p>
      </div>
      <div class="header-actions">
        <button (click)="toggleActions()">Actions ⌄</button>
        <div class="action-menu" *ngIf="actionsExpanded">
          <button>Export</button>
          <button>Refresh</button>
          <button>Settings</button>
        </div>
      </div>
    </header>

    <div class="search-row">
      <input type="text" placeholder="Search all data..." />
    </div>

        <div class="cards-grid">
          <article
            *ngFor="let insight of insights"
            class="insight-card"
            (click)="selectInsight(insight)"
            [class.selected]="activeInsight === insight.title">
            <div class="card-content">
              <p class="card-title">{{ insight.title }}</p>
              <h3>{{ insight.value }}</h3>
              <p class="card-meta">{{ insight.meta }}</p>
            </div>
        <div class="chart-icon" [ngClass]="insight.type">
          <span>{{ insight.type }}</span>
        </div>
      </article>
    </div>
  </section>
</div>
