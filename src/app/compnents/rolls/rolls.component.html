<div class="category-page">
  <div class="category-hero">
    <img src="assets/roll.jpeg" alt="Rolls" />
  </div>
  <h1>Rolls</h1>
  <p class="lead">Hot rolls wrapped and ready.</p>
  <div class="kota-grid">
    <article *ngFor="let roll of rolls" class="kota-card">
      <div class="kota-image">
        <img [src]="roll.image" [alt]="roll.name" />
      </div>
      <header>
        <h2>{{ roll.name }}</h2>
        <span class="price">R {{ roll.price }}</span>
      </header>
      <p class="description">{{ roll.description }}</p>
      <p class="rating" *ngIf="roll.rating">{{ roll.rating }}</p>
    </article>
  </div>
</div>
