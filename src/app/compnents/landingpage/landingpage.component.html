
<div class="landing-container">
  <div class="hero-wrapper">
    <nav class="hero-nav">
      <div class="logo">
        <span class="logo-spark"></span>
        <div>
          <strong>Lolly's</strong>
          <span>Fresh &amp; Tasty</span>
        </div>
      </div>
      <div class="nav-links">
        <a routerLink="/">Home</a>
        <a routerLink="/menu">Hot Item</a>
        <a routerLink="/menu">Menus</a>
        <a routerLink="/contact">Contact</a>
      </div>
      <div class="nav-actions">
        <button *ngIf="!isAuthenticated" routerLink="/login" class="link-btn">Login</button>
        <button *ngIf="!isAuthenticated" routerLink="/register" class="link-btn">Register</button>
        <button *ngIf="isAuthenticated" (click)="logout()" class="link-btn">Logout</button>
        <button routerLink="/menu" class="btn-primary">Order</button>
      </div>
    </nav>

    <div class="hero-panel">
      <div class="hero-copy">
        <p class="label">Delicious</p>
        <h1>Welcome to the world of Tasty &amp; Fresh Food.</h1>
        <p class="tagline">Quick Food, Good Taste</p>
        <p class="description">
          Keep it easy with these simple but delicious recipes. From make-ahead lunches and midweek meals to fuss-free sides.
        </p>
        <div class="hero-actions">
          <button class="btn-primary" routerLink="/menu">Buy Now</button>
          <button class="btn-secondary" (click)="goToMenu()">Learn More</button>
        </div>
        <div class="search-bar">
          <input type="text" placeholder="Search, Burger" />
          <button type="button">Search</button>
        </div>
      </div>
      <div class="hero-illustration">
        <img src="assets/chips.jpeg" alt="Chips stack" />
        <span class="note"></span>
      </div>
    </div>
  </div>
</div>
