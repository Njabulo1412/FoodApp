<div class="category-page">
  <h1>Wings</h1>
  <p class="lead">Choose your heat and sauce style.</p>
  <div class="combo-grid">
    <article *ngFor="let wing of wings">
      <div class="combo-visual">
        <img [src]="wing.image || 'assets/wings.jpg'" [alt]="wing.name" />
      </div>
      <header>
        <h2>{{ wing.name }}</h2>
        <span class="price">R {{ wing.price }}</span>
      </header>
      <p class="description">{{ wing.description }}</p>
      <p class="rating" *ngIf="wing.rating">{{ wing.rating }}</p>
      <button type="button" (click)="addToCart(wing)" class="btn-add-cart">Add to cart</button>
    </article>
  </div>
</div>
