<div class="register-container">
  <div class="register-card">
    <h1>Create Account</h1>
    
    <div *ngIf="error" class="alert alert-error">
      {{ error }}
    </div>
    
    <div *ngIf="success" class="alert alert-success">
      {{ success }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input 
          type="text" 
          id="firstName"
          formControlName="firstName"
          placeholder="Enter your first name"
          [class.is-invalid]="submitted && f['firstName'].invalid">
        <div *ngIf="submitted && f['firstName'].invalid" class="error-text">
          {{ getErrorMessage('firstName') }}
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input 
          type="text" 
          id="lastName"
          formControlName="lastName"
          placeholder="Enter your last name"
          [class.is-invalid]="submitted && f['lastName'].invalid">
        <div *ngIf="submitted && f['lastName'].invalid" class="error-text">
          {{ getErrorMessage('lastName') }}
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.is-invalid]="submitted && f['email'].invalid">
        <div *ngIf="submitted && f['email'].invalid" class="error-text">
          {{ getErrorMessage('email') }}
        </div>
      </div>

      <div class="form-group">
        <label for="mobileNumber">Mobile Number:</label>
        <input 
          type="tel" 
          id="mobileNumber"
          formControlName="mobileNumber"
          placeholder="Enter your mobile number (10-15 digits)"
          [class.is-invalid]="submitted && f['mobileNumber'].invalid">
        <div *ngIf="submitted && f['mobileNumber'].invalid" class="error-text">
          {{ getErrorMessage('mobileNumber') }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password (Min 8 characters):</label>
        <input 
          type="password" 
          id="password"
          formControlName="password"
          placeholder="Enter a strong password"
          [class.is-invalid]="submitted && f['password'].invalid">
        <div *ngIf="submitted && f['password'].invalid" class="error-text">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input 
          type="password" 
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirm your password"
          [class.is-invalid]="submitted && (f['confirmPassword'].invalid || registerForm.errors?.['passwordMismatch'])">
        <div *ngIf="submitted && registerForm.errors?.['passwordMismatch']" class="error-text">
          Passwords do not match
        </div>
      </div>

      <button 
        type="submit" 
        class="btn-register"
        [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <div class="login-link">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
